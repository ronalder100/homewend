# Bare binaries with fixed names, so install.sh can fetch
# releases/latest/download/homewend_<os>_<arch> without knowing the version.
# No Windows build until the session can read Windows' encrypted cookies.
version: 2
project_name: homewend

builds:
  - main: ./cmd/homewend
    binary: homewend
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [binary]
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

# The checksums are signed, and with them every binary they name: keyless,
# with the identity of the release workflow, into one Sigstore bundle beside
# the file (goreleaser.com/customization/sign).
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

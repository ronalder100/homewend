# A tag like v0.1.0 builds the binaries and publishes them as a release.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Every binary goes to VirusTotal, and the links to its reports are added
      # to the release notes, where anyone about to download can open them.
      - id: virustotal
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          request_rate: 4
          files: |
            dist/homewend_*_amd64
            dist/homewend_*_arm64
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANALYSIS: ${{ steps.virustotal.outputs.analysis }}
        run: |
          {
            gh release view "$GITHUB_REF_NAME" --json body -q .body
            printf '\n\n**VirusTotal**\n\n'
            echo "$ANALYSIS" | tr ',' '\n' | while IFS='=' read -r file url; do
              echo "- [$(basename "$file")]($url)"
            done
          } > notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md

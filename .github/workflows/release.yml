# A tag like v0.1.0 builds the binaries and publishes them as a release.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The identity the checksums are signed with, and the provenance stored.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Builds, signs the checksums and uploads everything to a draft release.
      # goreleaser signs before it uploads: a signing that fails uploads nothing.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The check SECURITY.md tells people to run, on what was just uploaded.
      - run: >
          cosign verify-blob
          --certificate-identity-regexp '^https://github\.com/ronalder100/homewend/\.github/workflows/release\.yml@refs/tags/v'
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          --bundle dist/homewend_checksums.txt.sigstore.json
          dist/homewend_checksums.txt
      # Where each binary was built, from what and by what: SLSA provenance
      # for every file the checksums name, signed by GitHub.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-checksums: dist/homewend_checksums.txt
      # The desktop app goes in the same release as the CLI, with the file
      # its updater reads (latest-linux.yml): the CLI's update and the app's
      # both look at releases/latest. Off until the repository variable
      # RELEASE_DESKTOP is "true": the app is not released yet.
      - if: vars.RELEASE_DESKTOP == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - if: vars.RELEASE_DESKTOP == 'true'
        run: |
          (cd web && npm ci)
          cd electron && npm ci && npm run dist -- --publish never
          gh release upload "$TAG" dist/*.AppImage dist/latest-linux.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
      - if: vars.RELEASE_DESKTOP == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: electron/dist/*.AppImage
      # The provenance goes beside the binaries, is checked as SECURITY.md
      # says, and only then is the release published.
      - run: |
          cp "$BUNDLE" homewend_provenance.intoto.jsonl
          binary="$(find dist -type f -name homewend -path '*linux_amd64*' | head -n 1)"
          gh attestation verify "$binary" --repo "$GITHUB_REPOSITORY" --bundle homewend_provenance.intoto.jsonl
          gh release upload "$TAG" homewend_provenance.intoto.jsonl
          gh release edit "$TAG" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}

# The desktop app built on every system for a branch other than main, kept as
# the run's artifacts: the builds are tried before a tag publishes them.
name: desktop

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homewend-${{ runner.os }}
          path: |
            electron/dist/*.AppImage
            electron/dist/*.dmg
            electron/dist/*.exe
            electron/dist/latest*.yml
          if-no-files-found: error

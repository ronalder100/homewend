# The fuzz tests, a minute each: on every change, and once a week on code that
# has not changed, because the fuzzer finds by chance what it finds.
name: fuzz

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 3"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # One target per run: go test fuzzes one at a time.
      - run: go test ./internal/library -run '^$' -fuzz '^FuzzExifDate$' -fuzztime 60s
      - run: go test ./internal/library -run '^$' -fuzz '^FuzzParseManifest$' -fuzztime 60s
      # An input that broke something is written under testdata/fuzz: kept, so
      # that it can be added to the repository as a test.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-findings
          path: internal/library/testdata/fuzz

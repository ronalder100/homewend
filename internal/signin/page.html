<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homewend</title>
<style>
/* Tokens and type from the site's design system, so that the window the user
   ends on looks like the product they started from. */
@font-face { font-family: "Inter"; font-weight: 400; src: url(/fonts/inter-400.woff2) format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 700; src: url(/fonts/inter-700.woff2) format("woff2"); }
:root {
  --bg: #FFFFFF; --fg: #0A0A0A; --muted: #6B6B6B;
  --accent: #2F5BFF; --ok: #1E9E5A; --err: #D93A2B;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1A1B26; --fg: #C0CAF5; --muted: #9AA5CE;
    --accent: #7AA2F7; --ok: #9ECE6A; --err: #F7768E;
  }
}
* { margin: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 32px; padding: 40px 16px; text-align: center;
  background: var(--bg); color: var(--muted);
  font: 400 16px/1.5 "Inter", system-ui, sans-serif;
}
.brand {
  position: fixed; top: 24px; left: 0; right: 0;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  color: var(--fg); font-weight: 700; font-size: 20px; letter-spacing: -0.02em;
}
.brand svg { width: 18px; height: 28px; fill: var(--accent); }
.mark { width: 96px; height: 96px; }
.mark circle, .mark path { fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.ok .mark { stroke: var(--ok); }
.cancelled .mark { stroke: var(--err); }
/* The circle draws itself, then the tick, then the words come up. */
.mark circle { stroke-dasharray: 264; stroke-dashoffset: 264; animation: draw .6s ease-out forwards; }
.mark path { stroke-dasharray: 80; stroke-dashoffset: 80; animation: draw .35s ease-out .5s forwards; }
.words { opacity: 0; transform: translateY(8px); animation: rise .4s ease-out .7s forwards; }
h1 { color: var(--fg); font-size: 32px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 8px; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes rise { to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .mark circle, .mark path, .words { animation: none; stroke-dashoffset: 0; opacity: 1; transform: none; }
}
</style>
<body class="{{if .OK}}ok{{else}}cancelled{{end}}">
<div class="brand">
  <svg viewBox="-44 -1 243 243" aria-hidden="true"><path d="M69.58 128.26895c-12.845-1.99499-20.72-4.65501-20.72-11.09502 0-6.36999 8.365-9.86999 21.45502-14.55999 34.64998-12.215 50.95999-22.4 50.95999-46.305l0-5.11 24.64 0c2.55499-0.07 4.655-2.13499 4.54999-4.655l-0.14-6.825c-0.07-1.61001-0.83998-3.08-2.13498-4.025l-44.41501-34.755c-1.785-1.33-4.30501-1.225-6.02001 0.175l-44.13499 35.385c-1.40001 1.085-2.03001 2.765-1.96001 4.515l0.07001 6.405c0 2.59 2.06499 4.41 4.585 4.34001l20.50999-0.21001 0 5.355c0 10.39499-7.62999 14.21-25.19999 20.57999-23.31001 8.57501-45.88501 18.795-45.88501 42.38501 0 27.545 28.735 34.79 56.84 40.04 23.80001 4.41001 41.19501 7.525 41.19501 16.87001 0 13.93-34.61501 16.69499-80.53501 20.615-13.65 1.22499-23.24 10.98998-23.24 22.53999 0 12.00501 10.57 20.965 23.275 20.79001 34.26501-1.19 131.355-11.515 131.355-62.16 0-41.51001-51.69499-44.76502-85.05-50.295z"/></svg>
  Homewend
</div>
<svg class="mark" viewBox="0 0 96 96" aria-hidden="true">
  <circle cx="48" cy="48" r="42"/>
  {{if .OK}}<path d="M30 49 l12 12 l24 -26"/>{{else}}<path d="M34 34 l28 28 m0 -28 l-28 28"/>{{end}}
</svg>
<div class="words">
  <h1>{{index .Text "title"}}</h1>
  <p>{{index .Text "body"}}</p>
</div>
</body>
</html>
